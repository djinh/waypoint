[project]
name = "waypoint"
dynamic = ["version"]  # from src/waypoint/__init__.py
license = "MIT"
description = "Open items, dependencies and wake-ups for a group of agent sessions"
readme = "README.md"
requires-python = ">=3.11"
# starlette and uvicorn serve the HTTP API; mcp is the official MCP SDK for the MCP server
# (it depends on starlette, uvicorn and jsonschema too).
# Each below its next major version, so a release that may break us is never installed silently.
dependencies = ["starlette>=0.40,<2", "uvicorn>=0.30,<1", "jsonschema>=4.18,<5", "mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

[project.scripts]
waypointd = "waypoint.server:main"
waypoint-deliver = "waypoint.deliver:main"
waypoint-mcp = "waypoint.mcp_server:main"
wp = "waypoint.wp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/waypoint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/waypoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Errors only: syntax errors and pyflakes (unused names, undefined names, f-strings without fields).
select = ["E9", "F"]
